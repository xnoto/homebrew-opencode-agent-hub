name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    name: Homebrew Audit
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Tap local formula
        run: |
          mkdir -p $(brew --repository)/Library/Taps/xnoto
          ln -s $GITHUB_WORKSPACE $(brew --repository)/Library/Taps/xnoto/homebrew-opencode-agent-hub

      - name: Trust local tap
        run: brew trust xnoto/opencode-agent-hub

      - name: Audit formula
        run: |
          brew audit --strict opencode-agent-hub

  # Install coverage remains disabled; Homebrew Audit is the required check.
  # Re-enable after source-build installation is made reliable in CI.
